flow:
  port: COM5
  address: 3
  baudrate: 38400
  channel: 1

  # Scaling / interpretation
  scale_mode: engineering
  full_scale_raw: 32000

  # ES-FLOW standard ProPar mapping
  meas: [33, 0]   # Fmeasure
  setp: [33, 3]   # Fsetpoint

  # I/O
  io_timeout_s: 1.5
  inter_request_sleep_s: 0.03

  # Write + ramp
  max_write_retries: 2
  readback_tolerance: 0.05
  ramp_max_step: 0.2
  ramp_sleep_s: 0.15

  # Fault handling / logging
  fail_soft: true
  fail_hard_after_consecutive: 10
  log_raw_on_fail: true
