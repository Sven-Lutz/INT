[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "pellikan-os"
version = "0.1.0"
description = "Pellikan filtration experiment control software"
requires-python = ">=3.11,<3.13"
dependencies = [
    "PySide6>=6.6,<7.0",
    "PyYAML>=6.0,<7.0",
    "pyserial>=3.5,<4.0",
    "numpy>=1.26,<3.0",
    "pandas>=2.0,<3.0",
    "matplotlib>=3.7,<4.0",
    "pyqtgraph>=0.13,<1.0",
    "qdarktheme>=2.1,<3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.black]
line-length = 100
target-version = ["py311"]
skip-string-normalization = false

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["src"]

[tool.flake8]
max-line-length = 100
extend-ignore = ["E203", "W503", "E501"]
per-file-ignores = [
    # Allow long lines in generated or style-heavy files
    "src/gui/monitor/server.py:E501",
    "src/gui/frames/right_frame.py:E501",
]

[tool.autopep8]
max-line-length = 100
in-place = true
aggressive = 1
